[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent"
version = "0.1.0"
description = "A minimal, modular, educational agent framework, built step by step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
tiny-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main"]   # code/cli.py and code/main.py, which sit beside the packages

[tool.setuptools.packages.find]
where = ["code"]   # the packages live in code/ (code/tiny_agent, code/llm_client)
include = ["tiny_agent*", "llm_client*"]
exclude = ["tiny_agent.tests*", "llm_client.tests*"]
namespaces = true  # code/tiny_agent/ has no __init__.py; the harness is in code/tiny_agent/shared/

[tool.ruff]
src = ["code"]   # tiny_agent, llm_client, main and cli are first-party, so imports sort as pytest, blank line, then these
