[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent"
version = "0.1.0"
description = "A minimal, modular, educational agent framework, built step by step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
tiny-agent = "tiny_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]   # tiny_agent, with tiny_agent/llm_client inside it
include = ["tiny_agent*"]
exclude = ["tiny_agent.tests*"]
namespaces = true  # tiny_agent/ has no __init__.py; the harness is in tiny_agent/agent/

[tool.ruff]
src = [".", "experimentation/chat-app/backend"]   # first-party code: tiny_agent (with llm_client, main and cli inside) and the backend modules, so imports sort as pytest, blank line, then these
