# The TinyAgent terminal chat (tiny_agent, with the model client, cli.py and main.py inside it) in a
# container, on its own: no chat app, no other service. Run it from this folder:
#
#   docker compose run --rm --build tiny-agent                       the interactive chat
#   docker compose run --rm --build tiny-agent python -m tiny_agent "Why is the sky blue?"
#                                                                    one question, one answer
#   docker compose run --rm --build tiny-agent python -m tiny_agent.main  the two-turn memory demo
#
# or from the repo root: `node execute.mjs tiny-agent ["question"]` (and `node execute.mjs up tiny-agent`
# to only build the image).
#
# It needs a model server somewhere: by default whatever answers on this machine's port 3200
# (host.docker.internal:3200), which is either the model server of the llm-client folder
# (`node execute.mjs up llm-client`) or the chat app's gateway (`node execute.mjs up`). Point it
# anywhere else with TINYAGENT_LLM_URL (see .env.example).
name: tiny-agent

services:
  tiny-agent:
    build:
      context: ../..   # the repo root; Dockerfile.dockerignore sends only tiny_agent/
      dockerfile: deploy/tiny-agent/Dockerfile
    image: tiny-agent
    environment:
      TINYAGENT_LLM_URL: ${TINYAGENT_LLM_URL:-http://host.docker.internal:${GATEWAY_PORT:-3200}/v1}
      TINYAGENT_LOG_DIR: /logs   # cli.log and main.log
    extra_hosts:
      - "host.docker.internal:host-gateway"   # built in on Docker Desktop; this line makes it work on Linux too
    volumes:
      # Where the chat app's Vector reads cli.log and main.log, so the agent's logs show up in OpenObserve.
      # Docker creates the folder if it is missing, so the agent still runs without the chat app.
      - ../../experimentation/chat-app/logs:/logs
    command: ["python", "-m", "tiny_agent"]   # same as the `tiny-agent` command
    stdin_open: true
    tty: true
