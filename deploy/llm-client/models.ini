; llama.cpp model presets (router mode), mounted into the llama container. A copy of experimentation/chat-app/models/models.ini, so this folder works on its own; keep the two in step.
; Add or change a model here the same way (see experimentation/chat-app/models/README.md).
;
; Each section name is the "model" value clients send. llama.cpp downloads the model
; from Hugging Face the first time it is loaded and keeps it in the cache folder
; (models/cache here, mounted at /models), so later starts need no download.
; Add a model: add a section with hf-repo (and hf-file when the repo has several
; files, or a quantisation after a colon, like unsloth/Qwen3.5-4B-GGUF:Q4_K_M).

[*]
ctx-size = 8192
n-gpu-layers = 99
jinja = true

; Google's own quantisation-aware-trained 4-bit build of Gemma 4 E4B (about 5 GB).
[gemma4-e4b]
hf-repo = google/gemma-4-E4B-it-qat-q4_0-gguf
hf-file = gemma-4-E4B_q4_0-it.gguf

; Qwen 3.5 4B, 4-bit Q4_K_M (about 2.7 GB).
[qwen3.5-4b]
hf-repo = unsloth/Qwen3.5-4B-GGUF:Q4_K_M
