# llama.cpp server in router mode, reusing the GGUF files Ollama downloaded.
# Ollama stores each model as a plain GGUF blob named by its sha256, so the
# folder is mounted read-only and models.ini maps friendly names to blobs.
# Switch at runtime by sending a different "model" in the request; the server
# loads it on demand and unloads the least recently used one (LLAMA_MODELS_MAX).
#
# pull-models runs first: it downloads any model in PULL_MODELS that Ollama does
# not have yet into the same folder, then exits. llama starts only after it
# finishes, so `docker compose up` works on a machine with no models at all.
services:
  pull-models:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"
    volumes:
      # Read-write: this is where downloads land (the same folder Ollama uses).
      - ${OLLAMA_MODELS_DIR:-~/.ollama/models}:/root/.ollama/models
      - ./pull-models.sh:/pull-models.sh:ro
    environment:
      # Ollama names, space separated. Keep in step with the sections in models.ini.
      PULL_MODELS: ${PULL_MODELS:-gemma4:e4b-it-qat qwen3.5:4b}

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    depends_on:
      pull-models:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ${OLLAMA_MODELS_DIR:-~/.ollama/models}/blobs:/models:ro
      - ./models.ini:/models.ini:ro
    environment:
      LLAMA_ARG_MODELS_PRESET: /models.ini
      LLAMA_ARG_MODELS_MAX: ${LLAMA_MODELS_MAX:-1}   # models kept loaded at once (VRAM is tight)
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
