# The single entry point: the browser only ever talks to this server.
#   /            -> frontend (static React app)
#   /api, /v1    -> backend (which talks to llama.cpp)
#   /health      -> backend
server {
  listen 80;
  client_max_body_size 20m;

  # Docker's embedded DNS; resolving at request time lets the gateway start
  # before the other containers and survive their restarts.
  resolver 127.0.0.11 valid=10s;

  location ~ ^/(api/|v1/|health$) {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;            # stream tokens as they arrive
    proxy_read_timeout 600s;        # a model load can take minutes
    proxy_send_timeout 600s;
  }

  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
