# llama.cpp server in router mode, reusing the GGUF files Ollama downloaded.
# Ollama stores each model as a plain GGUF blob named by its sha256, so the
# folder is mounted read-only and models.ini maps friendly names to blobs.
# Switch at runtime by sending a different "model" in the request; the server
# loads it on demand and unloads the least recently used one (LLAMA_MODELS_MAX).
#
# pull-models runs first: it downloads any model in PULL_MODELS that Ollama does
# not have yet into the same folder, then exits. llama starts only after it
# finishes, so `docker compose up` works on a machine with no models at all.
# Keep the project name stable: the folder is called deploy, not chat-app.
name: chat-app

services:
  pull-models:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"
    volumes:
      # Read-write: this is where downloads land (the same folder Ollama uses).
      - ${OLLAMA_MODELS_DIR:-${USERPROFILE:-${HOME}}/.ollama/models}:/root/.ollama/models
      - ../models/pull-models.sh:/pull-models.sh:ro
    environment:
      # Ollama names, space separated. Keep in step with the sections in models.ini.
      PULL_MODELS: ${PULL_MODELS:-gemma4:e4b-it-qat qwen3.5:4b}

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    depends_on:
      pull-models:
        condition: service_completed_successfully
    # No published port: only the backend reaches llama-server, over the compose network.
    expose:
      - "8080"
    volumes:
      - ${OLLAMA_MODELS_DIR:-${USERPROFILE:-${HOME}}/.ollama/models}/blobs:/models:ro
      - ../models/models.ini:/models.ini:ro
    environment:
      LLAMA_ARG_MODELS_PRESET: /models.ini
      LLAMA_ARG_MODELS_MAX: ${LLAMA_MODELS_MAX:-1}   # models kept loaded at once (VRAM is tight)
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_WEBUI: "0"   # turn off llama.cpp's built-in chat page; the custom frontend is the only UI
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Streaming proxy in front of llama-server (backend/server.py).
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    depends_on:
      llama:
        condition: service_started
    expose:
      - "8000"
    environment:
      LLAMA_URL: http://llama:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The React app, built by Vite and served by nginx, which forwards /v1 to the backend.
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    volumes:
      - ./frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  # The only published service: one door for the app and its API.
  gateway:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-3200}:80"
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
