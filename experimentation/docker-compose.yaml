# llama.cpp server in router mode. It downloads each model from Hugging Face the first time
# the model is loaded (see chat-app/models/models.ini) and keeps it in the cache folder
# chat-app/models/cache, so later starts need no download. Nothing else downloads models.
# Switch at runtime by sending a different "model" in the request; the server
# loads it on demand and unloads the least recently used one (LLAMA_MODELS_MAX).
#
# Keep the project name stable: this folder is called experimentation, not chat-app.
name: chat-app

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # No published port: only the backend reaches llama-server, over the compose network.
    expose:
      - "8080"
    secrets:
      - llama_api_key
    volumes:
      - ./chat-app/models/cache:/models   # downloaded models; read-write so llama.cpp can save them
      - ./chat-app/models/models.ini:/models.ini:ro
    environment:
      LLAMA_ARG_MODELS_PRESET: /models.ini
      LLAMA_CACHE: /models   # where Hugging Face downloads are kept
      LLAMA_ARG_MODELS_MAX: ${LLAMA_MODELS_MAX:-1}   # models kept loaded at once (VRAM is tight)
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_API_KEY_FILE: /run/secrets/llama_api_key   # only callers with this key (the backend) may use the model
      LLAMA_ARG_WEBUI: "0"   # turn off llama.cpp's built-in chat page; the custom frontend is the only UI
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Streaming proxy in front of llama-server (backend/server.py).
  backend:
    build:
      context: ./chat-app/backend
      dockerfile: ../deploy/backend.Dockerfile  # relative to the context
    depends_on:
      llama:
        condition: service_started
    expose:
      - "8000"
    environment:
      LLAMA_URL: http://llama:8080
      LLAMA_API_KEY_FILE: /run/secrets/llama_api_key
    secrets:
      - llama_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The React app, built by Vite and served by nginx, which forwards /v1 to the backend.
  frontend:
    build:
      context: ./chat-app/frontend
      dockerfile: ../deploy/frontend.Dockerfile  # relative to the context
    volumes:
      - ./chat-app/deploy/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  # The only published service: one door for the app and its API.
  gateway:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-3200}:80"
    volumes:
      - ./chat-app/deploy/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ---- Logs: OpenObserve stores and searches them; Vector collects them ----------
  # OpenObserve keeps its data in ./chat-app/logs/openobserve. The UI is on http://localhost:5080
  # (this machine only, already logged in). Docker logs of the chat-app containers go to the "docker" stream,
  # and ./chat-app/logs/cli.log and main.log (written by tiny-agent and main.py) to "tiny_agent".
  # The login is a Docker secret (see "secrets:" below); `node execute.mjs up` creates it.
  openobserve:
    build:
      context: ./chat-app/observability
      dockerfile: openobserve.Dockerfile
    environment:
      ZO_DATA_DIR: /data
    secrets:
      - openobserve_user
      - openobserve_password
    expose:
      - "5080"   # reached by Vector and by the "observe" proxy below, not published to the host
    volumes:
      - ./chat-app/logs/openobserve:/data

  # The web UI door: nginx in front of OpenObserve that opens it already logged in (no login
  # screen). Published on this machine only (127.0.0.1). See observability/auto-login.sh.
  observe:
    image: nginx:alpine
    entrypoint: ["/bin/sh", "/auto-login.sh"]
    depends_on:
      - openobserve
    secrets:
      - openobserve_user
      - openobserve_password
    ports:
      - "127.0.0.1:${OPENOBSERVE_PORT:-5080}:80"
    volumes:
      - ./chat-app/observability/auto-login.sh:/auto-login.sh:ro
      - ./chat-app/observability/observe.nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  vector:
    image: timberio/vector:latest-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - openobserve
    secrets:
      - openobserve_user
      - openobserve_password
    volumes:
      - ./chat-app/observability/vector.yaml:/etc/vector/vector.yaml:ro
      - ./chat-app/logs:/var/log/tiny-agent:ro   # cli.log and main.log
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lets Vector read the other containers' logs
      - vector-data:/var/lib/vector   # remembers how far each file has been read

# Credentials live in files that are NOT in git (secrets/ is ignored). `node execute.mjs up`
# creates them on first run with random values. llama_api_key is shared by llama-server (which
# requires it) and the backend (which sends it); the OpenObserve password is shown with
# `node execute.mjs observe --password`.
secrets:
  llama_api_key:
    file: ./chat-app/secrets/llama_api_key
  openobserve_user:
    file: ./chat-app/secrets/openobserve_user
  openobserve_password:
    file: ./chat-app/secrets/openobserve_password

volumes:
  vector-data:
